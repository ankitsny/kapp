name: Test on Kubernetes 1.27 and 1.32

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test-k8s:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        k8s-version: [1.30.0, 1.31.0]
    steps:
    - name: Kubernetes KinD Cluster
      uses: helm/kind-action@v1
      with:
        node_image: kindest/node:v${{ matrix.k8s-version }}
      # with:
      #   version: ${{ matrix.k8s-version }}
    - name: Verify Kind
      run: |
        kind version
        kubectl version
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      # with:
      #   path: src/github.com/${{ github.repository }}
      #   fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Verify go
      run: |
        go version
        ls -al
    - name: Run Tests
      run: |
        set -e -x

        export GOPATH=$(pwd)
        cd ${{ github.repository }}

        # Install ytt for build
        mkdir -p /tmp/bin
        export PATH=/tmp/bin:$PATH

        ./hack/verify-no-dirty-files.sh

        wget -O- https://carvel.dev/install.sh | K14SIO_INSTALL_BIN_DIR=/tmp/bin bash

        # curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        # install minikube-linux-amd64 /usr/local/bin/minikube
        # minikube start --driver=docker
        # eval $(minikube docker-env --shell=bash)

        # Ensure that there is no existing kapp installed
        rm -f /tmp/bin/kapp

        ./hack/build-binaries.sh

        export KAPP_E2E_NAMESPACE=kapp-test
        kubectl create ns $KAPP_E2E_NAMESPACE

        ./hack/test-all.sh

        